name: Build Kokoro TTS APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: |
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Save Build Log on Failure
        if: failure()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan build-logs
          git rm -rf . || true
          cp build.log failure.log
          git add failure.log
          git commit -m "build failure log for ${{ github.sha }}"
          git push -f origin build-logs || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KokoroTTS-arm64-v8a-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Latest Debug Build (arm64-v8a)"
          body: "Automated continuous build for Kokoro TTS Android (arm64-v8a)."
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
