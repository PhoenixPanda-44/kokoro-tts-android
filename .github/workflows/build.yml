name: Build Kokoro TTS APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: |
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Save Build Log and Diagnostics
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan build-diagnostic
          git rm -rf . || true
          [ -f build.log ] && cp build.log build.log || true
          find . -name "*.apk" > apks-found.txt 2>&1 || true
          find app/build/outputs > outputs-tree.txt 2>&1 || true
          git add build.log apks-found.txt outputs-tree.txt 2>/dev/null || true
          git commit -m "build diagnostic log" || true
          git push -f origin build-diagnostic || true

      - name: Prepare Release APK
        run: |
          mkdir -p release-apks
          find app/build/outputs/ -name "*.apk" -exec cp {} release-apks/KokoroTTS-arm64-v8a-debug.apk \;
          ls -lh release-apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KokoroTTS-arm64-v8a-debug
          path: release-apks/KokoroTTS-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Latest Debug Build (arm64-v8a)"
          body: "Automated continuous build for Kokoro TTS Android (arm64-v8a)."
          prerelease: true
          files: release-apks/KokoroTTS-arm64-v8a-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
